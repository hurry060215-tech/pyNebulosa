[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-nebulosa-omicverse"
version = "0.1.0"
description = "Single-cell data visualization using kernel gene-weighted density estimation"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "ATTRIBUTION.md"]
authors = [
    {name = "Mikhael Manurung"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
keywords = [
    "single-cell",
    "RNA-seq",
    "visualization",
    "kernel-density-estimation",
    "bioinformatics",
    "scanpy",
    "scverse",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "matplotlib>=3.5",
    "anndata>=0.8",
]

[project.urls]
Upstream = "https://github.com/mdmanurung/pyNebulosa"
Source = "https://github.com/hurry060215-tech/pyNebulosa"
Home-page = "https://github.com/hurry060215-tech/pyNebulosa"

[[project.maintainers]]
name = "Haoliang Zhu"

[project.optional-dependencies]
scanpy = ["scanpy>=1.9"]
doc = [
    "sphinx>=5",
    "furo>=2024.0",
    "myst-nb>=1.0",
    "sphinx-autodoc-typehints",
    "ipython",
]
test = [
    "pytest>=7",
    "pytest-cov",
]
dev = [
    "py-nebulosa-omicverse[test,doc,scanpy]",
    "pre-commit",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["ov_nebulosa"]

# --- Testing -----------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["ov_nebulosa"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

# --- Linting (ruff) ---------------------------------------------------

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "B",       # flake8-bugbear
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "W",       # pycodestyle warnings
    "RUF100",  # unused noqa
]

[tool.ruff.lint.isort]
known-first-party = ["ov_nebulosa"]

[tool.ruff.format]
docstring-code-format = true

[tool.hatch.build.targets.sdist]
include = ["/ov_nebulosa", "/tests", "/scripts", "/README.md", "/UPSTREAM_README.md", "/RELEASE.md", "/ATTRIBUTION.md", "/LICENSE", "/pyproject.toml"]
